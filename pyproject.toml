[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "printpulse"
version = "0.1.0"
description = "Autonomous 3D Print Farm Scrap Risk Predictor & Quoting Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Refox Lee", email = "g1517705600@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "temporalio>=1.34.0",
    "tabpfn>=9.2.0",
    "tabpfn-client>=0.6.1",
    "scikit-learn>=1.4.0",
    "torch>=2.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "Pillow>=10.0.0"
]
